# yaml-language-server: $schema=https://dv-flow.github.io/flow.dv.schema.json
# 1. Call Python as a library: the scoreboard's reference model in numpy.
package:
  name: sb_numpy
  with:
    sim:
      type: str
      # vlt (Verilator), mti, vcs or xcm; set with -D sim=<sim>
      value: "vlt"
  imports:
  - ../common/flow.yaml

  tasks:
  - name: sb-src
    desc: The numpy-backed scoreboard and numpy_test
    uses: std.FileSet
    with:
      type: systemVerilogSource
      include: [numpy_sb_pkg.sv]

  - name: pythonpath
    uses: std.SetEnv
    with:
      prepend_path:
        PYTHONPATH: ${{ srcdir }}

  - name: sim-img
    uses: "hdlsim.${{ sim }}.SimImage"
    needs:
    - "hdlsim.${{ sim }}.SimLibUVM"
    - pyhdl-if.SvPkg
    - pyhdl-if.DpiLib
    - tutorial.rtl
    - tutorial.ifs
    - tutorial.pkt
    - tutorial.env
    - sb-src
    - tutorial.tb
    with:
      top: [tb_top]

  - name: sim-run
    uses: "hdlsim.${{ sim }}.SimRun"
    needs: [pythonpath, sim-img]
    with:
      plusargs:
      - UVM_TESTNAME=numpy_test
