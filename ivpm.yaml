
package:
  name: pyhdl-if

  #  setup-deps:
  #- ninja
  #- cython

  dep-sets:

  - name: default-dev
    deps:
    - name: pytest
      src: pypi
    - name: pytest-asyncio
      src: pypi
    - name: cython
      src: pypi
    - name: build
      src: pypi
    - name: setuptools_scm
      src: pypi
    - name: pytest-dfm
      url: https://github.com/dv-flow/pytest-dfm.git
    - name: dv-flow-libhdlsim
      url: https://github.com/dv-flow/dv-flow-libhdlsim.git
    - name: dv-flow-mgr
      url: https://github.com/dv-flow/dv-flow-mgr.git
    - name: verilator
      url: https://github.com/edapack/verilator-bin
      src: gh-rls
      cache: true
    - name: pcpp
      src: pypi
    - name: cxxheaderparser
      src: pypi
    - name: sphinx
      src: pypi
    - name: sphinx-rtd-theme
      src: pypi
    - name: cairosvg
      src: pypi
    - name: sphinx-argparse
      src: pypi
    - name: packaging
      src: pypi
    - name: sphinx-systemverilog
      url: https://github.com/fvutils/sphinx-systemverilog.git

  - name: default-ci
    deps:
    - name: pytest
      src: pypi
    - name: cython
      src: pypi
    - name: build
      src: pypi
    - name: setuptools_scm
      src: pypi
    - name: pytest-dfm
      url: https://github.com/dv-flow/pytest-dfm.git
      dep-set: default-dev
    - name: dv-flow-libhdlsim
      url: https://github.com/dv-flow/dv-flow-libhdlsim.git
      dep-set: default-dev
    - name: dv-flow-mgr
      url: https://github.com/dv-flow/dv-flow-mgr.git
      dep-set: default-dev
    - name: pcpp
      src: pypi
    - name: cxxheaderparser
      src: pypi
    - name: packaging
      src: pypi

  # Everything needed to build the documentation, and nothing else. Kept apart
  # from default-ci because the two have incompatible requirements: the wheel
  # build runs across every supported Python and manylinux image, while
  # sphinx-systemverilog depends on pyslang, which publishes no wheel for
  # glibc 2.17 (manylinux2014) and none for cp38. Installing the doc toolchain
  # into the wheel build meant an sdist build of pyslang that cannot succeed
  # there -- for a toolchain that build has no use for.
  #
  # `uvm` is here for the same reason it always was: doc/source/conf.py
  # elaborates the pyhdl_uvm package against the UVM sources to generate the
  # SystemVerilog class reference, and drops that section entirely when they
  # are absent.
  - name: docs
    deps:
    - name: sphinx
      src: pypi
    - name: sphinx-rtd-theme
      src: pypi
    - name: sphinx-argparse
      src: pypi
    - name: cairosvg
      src: pypi
    - name: packaging
      src: pypi
    - name: sphinx-systemverilog
      # The released package, not the source tree: the docs are built against
      # what a user installs. default-dev keeps the git checkout, so local
      # development still gets an editable copy to change.
      src: pypi
    - name: uvm
      url: https://www.accellera.org/images/downloads/standards/uvm/UVM-1800.2-2020.3.1.tar.gz

  - name: default
    deps:
    - name: pytest
      src: pypi
        #    - name: pyvsc-dataclasses
        #      src: pypi
    - name: fusesoc
      src: pypi

  env:
    - name: PATH
      path-prepend: 
        - ${IVPM_PACKAGES}/verilator/bin
        - ${IVPM_PACKAGES}/iverilog/bin
    - name: PYTHONPATH
      path-prepend: ${IVPM_PROJECT}/src

  paths:
    project:
      lib-dirs:
      - src/hdl_if/share

