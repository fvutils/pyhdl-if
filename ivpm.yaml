
package:
  name: pyhdl-if

  dep-sets:
  - name: examples
    deps: 
    - name: pyhdl-if
      src: pypi 
    - name: verilator
      url: https://github.com/edapack/verilator-bin
      src: gh-rls
      version: v5.046
      cache: true
    - name: dv-flow-mgr
      src: pypi
    - name: dv-flow-libhdlsim
      src: pypi
    - name: pytest_dfm
      src: pypi

  - name: default
    deps:
    - name: pcpp
      src: pypi
    - name: cxxheaderparser
      src: pypi

  - name: default-dev
    deps:
    - name: pytest
      src: pypi
    - name: pytest-asyncio
      src: pypi
    - name: cython
      src: pypi
    - name: build
      src: pypi
    - name: setuptools_scm
      src: pypi
    - name: pytest-dfm
      url: https://github.com/dv-flow/pytest-dfm.git
    - name: dv-flow-libhdlsim
      url: https://github.com/dv-flow/dv-flow-libhdlsim.git
    - name: dv-flow-mgr
      url: https://github.com/dv-flow/dv-flow-mgr.git
    - name: verilator
      url: https://github.com/edapack/verilator-bin
      src: gh-rls
      version: v5.047.22543776923
      prerelease: true
      cache: true
    - name: pcpp
      src: pypi
    - name: cxxheaderparser
      src: pypi
    - name: sphinx
      src: pypi
    - name: breathe
      src: pypi
    - name: sphinx-rtd-theme
      src: pypi
    - name: cairosvg
      src: pypi
    - name: sphinx-argparse
      src: pypi
    - name: packaging
      src: pypi
        #    - name: cocotb
        #      src: pypi
    - name: doxygen-filter-sv
      url: https://github.com/SeanOBoyle/DoxygenFilterSystemVerilog.git
        #    - name: uvm
        #      url: https://www.accellera.org/images/downloads/standards/uvm/Accellera-1800.2-2017-1.0.tar.gz
        #      cache: true

  - name: default-ci
    deps:
    - name: pytest
      src: pypi
    - name: cython
      src: pypi
    - name: build
      src: pypi
    - name: setuptools_scm
      src: pypi
    - name: pytest-dfm
      url: https://github.com/dv-flow/pytest-dfm.git
      dep-set: default-dev
    - name: dv-flow-libhdlsim
      url: https://github.com/dv-flow/dv-flow-libhdlsim.git
      dep-set: default-dev
    - name: dv-flow-mgr
      url: https://github.com/dv-flow/dv-flow-mgr.git
      dep-set: default-dev
        #    - name: pyvsc-dataclasses
        #      url: https://github.com/vsc-tools/pyvsc-dataclasses.git
        #      dep-set: default-dev
    - name: pcpp
      src: pypi
    - name: cxxheaderparser
      src: pypi
    - name: sphinx
      src: pypi
    - name: breathe
      src: pypi
    - name: sphinx-rtd-theme
      src: pypi
    - name: cairosvg
      src: pypi
    - name: sphinx-argparse
      src: pypi
    - name: packaging
      src: pypi
    - name: doxygen-filter-sv
      url: https://github.com/SeanOBoyle/DoxygenFilterSystemVerilog.git


  env:
    - name: PATH
      path-prepend: 
        - ${IVPM_PACKAGES}/verilator/bin
        - ${IVPM_PACKAGES}/iverilog/bin
    - name: PYTHONPATH
      path-prepend: ${IVPM_PROJECT}/src

  paths:
    project:
      lib-dirs:
      - src/hdl_if/share

