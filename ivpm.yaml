
package:
  name: pyhdl-if

  #  setup-deps:
  #- ninja
  #- cython

  dep-sets:

  - name: default-dev
    deps:
    - name: pytest
      src: pypi
    - name: pytest-asyncio
      src: pypi
    - name: cython
      src: pypi
    - name: build
      src: pypi
    - name: setuptools_scm
      src: pypi
    - name: pytest-dfm
      url: https://github.com/dv-flow/pytest-dfm.git
    - name: dv-flow-libhdlsim
      url: https://github.com/dv-flow/dv-flow-libhdlsim.git
    - name: dv-flow-mgr
      url: https://github.com/dv-flow/dv-flow-mgr.git
    - name: verilator
      url: https://github.com/edapack/verilator-bin
      src: gh-rls
      cache: true
    - name: pcpp
      src: pypi
    - name: cxxheaderparser
      src: pypi
    - name: sphinx
      src: pypi
    - name: sphinx-rtd-theme
      src: pypi
    - name: cairosvg
      src: pypi
    - name: sphinx-argparse
      src: pypi
    - name: packaging
      src: pypi
    - name: sphinx-systemverilog
      url: https://git.dvkit.org/fvutils/sphinx-systemverilog.git

  - name: default-ci
    deps:
    - name: pytest
      src: pypi
    - name: cython
      src: pypi
    - name: build
      src: pypi
    - name: setuptools_scm
      src: pypi
    - name: pytest-dfm
      url: https://github.com/dv-flow/pytest-dfm.git
      dep-set: default-dev
    - name: dv-flow-libhdlsim
      url: https://github.com/dv-flow/dv-flow-libhdlsim.git
      dep-set: default-dev
    - name: dv-flow-mgr
      url: https://github.com/dv-flow/dv-flow-mgr.git
      dep-set: default-dev
    - name: pcpp
      src: pypi
    - name: cxxheaderparser
      src: pypi
    - name: sphinx
      src: pypi
    - name: sphinx-rtd-theme
      src: pypi
    - name: cairosvg
      src: pypi
    - name: sphinx-argparse
      src: pypi
    - name: packaging
      src: pypi
    - name: sphinx-systemverilog
      url: https://git.dvkit.org/fvutils/sphinx-systemverilog.git

  # The UVM library, needed only to build documentation: doc/source/conf.py
  # elaborates the pyhdl_uvm package against it to generate the SystemVerilog
  # class reference, and drops that section entirely when it is absent.
  - name: docs
    deps:
    - name: uvm
      url: https://www.accellera.org/images/downloads/standards/uvm/UVM-1800.2-2020.3.1.tar.gz

  - name: default
    deps:
    - name: pytest
      src: pypi
        #    - name: pyvsc-dataclasses
        #      src: pypi
    - name: fusesoc
      src: pypi

  env:
    - name: PATH
      path-prepend: 
        - ${IVPM_PACKAGES}/verilator/bin
        - ${IVPM_PACKAGES}/iverilog/bin
    - name: PYTHONPATH
      path-prepend: ${IVPM_PROJECT}/src

  paths:
    project:
      lib-dirs:
      - src/hdl_if/share

