
package:
  name: pyhdl-if

  #  setup-deps:
  #- ninja
  #- cython

  dep-sets:

  - name: default-dev
    deps:
    - name: pytest
      src: pypi
    - name: pytest-asyncio
      src: pypi
    - name: cython
      src: pypi
    - name: build
      src: pypi
    - name: setuptools_scm
      src: pypi
    - name: pytest-dfm
      url: https://github.com/dv-flow/pytest-dfm.git
    - name: dv-flow-libhdlsim
      url: https://github.com/dv-flow/dv-flow-libhdlsim.git
    - name: dv-flow-mgr
      url: https://github.com/dv-flow/dv-flow-mgr.git
    - name: verilator
      url: https://github.com/edapack/verilator-bin
      src: gh-rls
      cache: true
    - name: pcpp
      src: pypi
    - name: cxxheaderparser
      src: pypi
    - name: sphinx
      src: pypi
    - name: breathe
      src: pypi
    - name: sphinx-rtd-theme
      src: pypi
    - name: cairosvg
      src: pypi
    - name: sphinx-argparse
      src: pypi
    - name: packaging
      src: pypi
        #    - name: cocotb
        #      src: pypi
    - name: doxygen-filter-sv
      url: https://github.com/SeanOBoyle/DoxygenFilterSystemVerilog.git
  - name: default-ci
    deps:
    - name: pytest
      src: pypi
    - name: cython
      src: pypi
    - name: build
      src: pypi
    - name: setuptools_scm
      src: pypi
    - name: pytest-dfm
      url: https://github.com/dv-flow/pytest-dfm.git
      dep-set: default-dev
    - name: dv-flow-libhdlsim
      url: https://github.com/dv-flow/dv-flow-libhdlsim.git
      dep-set: default-dev
    - name: dv-flow-mgr
      url: https://github.com/dv-flow/dv-flow-mgr.git
      dep-set: default-dev
    - name: pcpp
      src: pypi
    - name: cxxheaderparser
      src: pypi
    - name: sphinx
      src: pypi
    - name: breathe
      src: pypi
    - name: sphinx-rtd-theme
      src: pypi
    - name: cairosvg
      src: pypi
    - name: sphinx-argparse
      src: pypi
    - name: packaging
      src: pypi
    - name: doxygen-filter-sv
      url: https://github.com/SeanOBoyle/DoxygenFilterSystemVerilog.git

  - name: default
    deps:
    - name: pytest
      src: pypi
        #    - name: pyvsc-dataclasses
        #      src: pypi
    - name: fusesoc
      src: pypi

  env:
    - name: PATH
      path-prepend: 
        - ${IVPM_PACKAGES}/verilator/bin
        - ${IVPM_PACKAGES}/iverilog/bin
    - name: PYTHONPATH
      path-prepend: ${IVPM_PROJECT}/src

  paths:
    project:
      lib-dirs:
      - src/hdl_if/share

