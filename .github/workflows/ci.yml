name: CI
on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  # ---------------------------------------------------------------------- #
  # The release-authority master switch. Resolved in its OWN job because an
  # `if:` on a job cannot reference a step in that same job, so the value has
  # to arrive through `needs.<job>.outputs`.
  #
  # A consumer that reads needs.gate.outputs WITHOUT declaring `needs: gate`
  # gets an EMPTY STRING rather than an error -- the publish condition is then
  # false forever, nothing publishes, and nothing goes red. That is the
  # quietest failure available here, so the shadow check in
  # .forgejo/workflows/ci.yml asserts the wiring explicitly.
  # ---------------------------------------------------------------------- #
  gate:
    name: Release authority
    runs-on: ubuntu-latest
    outputs:
      authority: ${{ steps.resolve.outputs.authority }}
    steps:
      - id: resolve
        # The python is ONE LINE on purpose: a multi-line `python3 -c` body has
        # to start at column 0, which terminates the YAML block scalar above it
        # and silently corrupts the workflow rather than failing to parse.
        run: |
          url=https://dvkit.org/.well-known/release-authority.json
          if ! body=$(curl -fsS --max-time 10 "$url"); then
            # FAIL CLOSED WHEN A RELEASE COULD ACTUALLY HAPPEN, and quietly
            # otherwise. In this org a release is a `v*` TAG, so that -- not
            # the event name -- is the test. Keying on the event name would be
            # wrong here in both directions: a tag push IS a push, so it would
            # let a release through unresolved, and every ordinary push would
            # then also be treated as release-critical and fail the build.
            #
            # A release blocked by a dvkit.org outage is recoverable in ten
            # minutes. A version published twice from two forges is not: PyPI
            # lets a version be yanked, never reused.
            case "$GITHUB_REF" in
              refs/tags/v*)
                echo "::error::release-authority switch unreachable; refusing to publish"
                exit 1 ;;
              *)
                echo "authority=none" >> "$GITHUB_OUTPUT"
                echo "switch unreachable, and this ref cannot release; continuing"
                exit 0 ;;
            esac
          fi
          auth=$(printf '%s' "$body" | python3 -c 'import json,os,sys; d=json.load(sys.stdin); r=os.environ["GITHUB_REPOSITORY"]; print(d["repos"].get(r) or d["orgs"].get(r.split("/")[0]) or d["default"])')
          echo "release authority for $GITHUB_REPOSITORY: $auth"
          echo "authority=$auth" >> "$GITHUB_OUTPUT"

  linux-pretest:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: Test build
      run: |
        python3 -m venv py
        ./py/bin/pip install -U ivpm
        ./py/bin/python3 -m ivpm update -a
        ./packages/python/bin/pip install -U typing_extensions build pcpp cxxheaderparser
        ./packages/python/bin/python3 setup.py build_ext --inplace
        ./packages/python/bin/python3 -m build -n
        ls src
    - name: Run tests
      id: run_tests
      run: |
        export PYTHONPATH=$(pwd)/src:${PYTHONPATH}
        export PATH=$(pwd)/packages/python/bin:${PATH}
        export PATH=$(pwd)/packages/verilator/bin:${PATH}
        export PATH=$(pwd)/packages/iverilog/bin:${PATH}
        ./packages/python/bin/pip install pytest-json-ctrf
        mkdir -p ctrf
        exit_code=0
        PYTEST_FV_HDLSIM=vlt ./packages/python/bin/python3 -m pytest ./tests/unit --ctrf ctrf/ctrf-report-vlt.json || exit_code=$?
        PYTEST_FV_HDLSIM=ivl ./packages/python/bin/python3 -m pytest ./tests/unit --ctrf ctrf/ctrf-report-ivl.json || exit_code=$?
        echo "test_exit_code=$exit_code" >> $GITHUB_OUTPUT
    - name: Publish Test Results
      uses: ctrf-io/github-test-reporter@v1
      with:
        report-path: 'ctrf/*.json'
      if: always()
    - name: Check test results
      if: always()
      run: |
        if [ "${{ steps.run_tests.outputs.test_exit_code }}" != "0" ]; then
          echo "Tests failed with exit code ${{ steps.run_tests.outputs.test_exit_code }}"
          exit 1
        fi
#        rm ivpm.yaml
#        export PATH=$(pwd)/py/bin:${PATH}
#        ./py/bin/pip install dist/*.whl
  doc:
    # Build-only. The published documentation is now dvkit.org/fvutils/pyhdl-if,
    # produced by .forgejo/workflows/ci.yml, which uploads the built HTML as an
    # artifact for a host-side staging poller. Built HTML is a build output, not
    # a git branch, so nothing here deploys to gh-pages any more. This job stays
    # because it catches doc breakage on pull requests, where the Forgejo
    # workflow does not run.
    runs-on: ubuntu-latest
    needs: linux-pretest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup
      run: |
        python3 -m pip install packaging sphinx cairosvg sphinx-argparse
        python3 -m pip install sphinx-rtd-theme sphinx-systemverilog
        # setuptools_scm is in setup.py's setup_requires; without it installed,
        # setuptools fetches it into .eggs without its dependencies and 10.x
        # then fails on `import vcs_versioning`.
        python3 -m pip install ivpm cxxheaderparser pcpp setuptools_scm
    - name: Build
      # Without the UVM sources conf.py drops the generated SystemVerilog class
      # reference from uvm.rst, so fetch them here too -- otherwise this job
      # would pass on a doc set the release build rejects.
      run: |
        python3 -m ivpm update -d docs
        python3 setup.py build_ext --inplace
        cd doc
        make html
        touch build/html/.nojekyll
  linux:
    runs-on: ubuntu-latest
    needs: [gate, linux-pretest]
    strategy:
      matrix:
        spec: ['cp38-cp38', 'cp39-cp39', 'cp310-cp310', 'cp311-cp311', 'cp312-cp312']
        image: [manylinux2014_x86_64, manylinux_2_28_x86_64, manylinux_2_34_x86_64]
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: Build packages
      env:
        IVPM_PYTHON: /opt/python/${{ matrix.spec }}/bin/python
        BUILD_NUM: ${{ github.run_id }}
      run: >
        docker run --rm
        --volume "$(pwd):/io"
        --env IVPM_PYTHON
        --env BUILD_NUM
        --workdir /io
        quay.io/pypa/${{ matrix.image }}
        /io/scripts/build_linux.sh      
    - name: Publish to PyPi
      # GATED 2026-08-31 (wave 3b). Two clauses, and both are load-bearing:
      #
      #   refs/tags/v*   this repo is mirrored to Forgejo and back on a five-minute
      #                  cron, and git-sync moves the DEFAULT BRANCH. The condition
      #                  replaced here was `refs/heads/master` (or main), which a sync
      #                  cycle satisfies by construction -- so mirroring was a release
      #                  trigger. A tag is a deliberate act; a cycle never creates one.
      #
      #   authority      the release-authority master switch at
      #                  dvkit.org/.well-known/release-authority.json, so that which
      #                  forge may publish is one decision in one place rather than
      #                  fourteen workflow files.
      #
      # WHAT THIS COSTS. The per-push `.<run-id>` dev wheel is gone: a push to the
      # default branch no longer publishes anything to PyPI. That is the same trade
      # already made for the eight mballance-utils repos, and it is the one
      # sync-policy.toml describes as outstanding for exactly this shape.
      if: >-
        needs.gate.outputs.authority == 'github' &&
        startsWith(github.ref, 'refs/tags/v')
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        python3 -m pip install -U twine packaging
        python3 -m twine upload wheelhouse/*.whl          

